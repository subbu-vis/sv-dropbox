[scan]
min_file_size_bytes = 1024
skip_shared_not_owned = true
skip_hidden = true
early_exit_row_threshold = 50
max_csv_rows = 100
ignored_folders =

[paths]
csv_output_dir = ./output
log_dir = ./logs

[media]
photo_extensions = jpg,jpeg,png
video_extensions = mp4,mov
